# 放在 VPS 的 /docker/arsen-site/docker-compose.yml
# 沿用 /docker/traefik 的 Traefik（certresolver=letsencrypt）
services:
  web:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./html:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    labels:
      - traefik.enable=true
      - traefik.http.routers.arsen.rule=Host(`arsen-industrial.com`) || Host(`www.arsen-industrial.com`)
      - traefik.http.routers.arsen.entrypoints=websecure
      - traefik.http.routers.arsen.tls.certresolver=letsencrypt
      - traefik.http.services.arsen.loadbalancer.server.port=80
